[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "document-intelligence-workbench"
version = "0.1.0"
description = "Local, evidence-linked invoice extraction and review workbench"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
evaluation = ["pyarrow==25.0.0", "Pillow==11.3.0"]

[project.scripts]
docwork = "docwork.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
