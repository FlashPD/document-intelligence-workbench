name: contracts

on:
  push:
  pull_request:

jobs:
  deterministic-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: make test
      - run: PYTHONPATH=src python -m docwork.cli demo-replay --prepare-only --output-dir artifacts/ci-replay
